name: Checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: SAMPLE_ENV_FILE=.env.example docker compose --env-file .env.example --profile netutils --profile weather config --quiet
