[project]
name = "sample-a2a-agents"
version = "0.1.0"
description = "Standalone Netutils and Weather A2A examples with streaming and a JWT gateway"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "a2a-sdk==1.2.2",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langchain-mcp-adapters==0.3.2",
    "langgraph==1.2.12",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_a2a_agents"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = ["click==8.5.0", "starlette==1.6.0"]
